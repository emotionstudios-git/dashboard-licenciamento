name = "dashboard-licenciamento"
pages_build_output_dir = "dist"

# Sem `pages_build_output_dir` o wrangler IGNORA este arquivo inteiro no
# `pages deploy` (avisa e segue) — foi assim que o binding do D1 não subiu
# no primeiro deploy e a API quebrou com env.DB undefined.
[[d1_databases]]
binding = "DB"
database_name = "dashboard-licenciamento-db"
database_id = "f1362dcb-f847-4d6c-8a84-50ff7d41e0ac"
